[project]
name = "auctor"
version = "0.1.0"
description = "Attribute a repository's prose to the models that wrote it, from version history and agent transcripts."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
auctor = "auctor.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
